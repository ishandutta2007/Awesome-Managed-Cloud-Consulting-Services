<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Cloud Hub Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Scan Line Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Animations (Standard CSS, Safe for GitHub image rendering) -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); opacity: 0.92; }
        50% { filter: drop-shadow(0 0 22px rgba(168, 85, 247, 0.95)); opacity: 1; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(240px); opacity: 0.2; }
      }
      @keyframes circuitDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes beaconRing {
        0% { r: 12px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 50px; opacity: 0; stroke-width: 0.5px; }
      }
      .pulse-cloud { animation: pulseGlow 4s infinite ease-in-out; }
      .scanner { animation: scanLine 5s infinite linear; }
      .circuit-line { stroke-dasharray: 10, 10; animation: circuitDash 8s infinite linear; }
      .radar-sweep { transform-origin: 120px 120px; animation: radarSweep 7s infinite linear; }
      .floating-node-1 { animation: floatNode 3.5s infinite ease-in-out; }
      .floating-node-2 { animation: floatNode 4.5s infinite ease-in-out 1s; }
      .beacon { animation: beaconRing 2.5s infinite cubic-bezier(0.2, 0.8, 0.4, 1); }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" fill="url(#bgGrad)" rx="16"/>
  <rect width="900" height="240" fill="url(#cyberGrid)" rx="16"/>

  <!-- Scanning Beam Effect -->
  <rect class="scanner" x="0" y="0" width="900" height="2" fill="url(#scanGrad)" opacity="0.6"/>

  <!-- Circuit Connecting Lines -->
  <path class="circuit-line" d="M 120 120 L 220 120 L 250 80 L 350 80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <path class="circuit-line" d="M 120 120 L 200 170 L 320 170" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <path class="circuit-line" d="M 850 50 L 780 50 L 750 90 L 680 90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
  <path class="circuit-line" d="M 880 190 L 800 190 L 770 150 L 700 150" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Left Cloud Radar & Architecture Hub -->
  <g transform="translate(15, 0)">
    <!-- Radar concentric circles -->
    <circle cx="120" cy="120" r="85" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4,4"/>
    <circle cx="120" cy="120" r="60" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="120" cy="120" r="35" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Radar Beacon Wave -->
    <circle class="beacon" cx="120" cy="120" r="12" fill="none" stroke="#38bdf8"/>

    <!-- Radar Rotating Beam -->
    <g class="radar-sweep">
      <path d="M 120 120 L 205 120 A 85 85 0 0 0 120 35 Z" fill="url(#cloudGrad)" opacity="0.12"/>
      <line x1="120" y1="120" x2="205" y2="120" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Cloud Infrastructure Emblem (Center of Left Hub) -->
    <g class="pulse-cloud" transform="translate(85, 95) scale(1.15)">
      <!-- Cloud Silhouette Glow -->
      <path d="M 18 38 A 14 14 0 0 1 12 11 A 20 20 0 0 1 48 6 A 16 16 0 0 1 60 22 A 13 13 0 0 1 54 38 Z" fill="url(#cloudGrad)" filter="url(#cloudGlow)" opacity="0.95"/>
      <path d="M 19 36 A 12 12 0 0 1 14 13 A 18 18 0 0 1 46 8 A 14 14 0 0 1 57 22 A 11 11 0 0 1 52 36 Z" fill="#090d16" opacity="0.8"/>
      <!-- Internal Cloud Tech Symbol (Server Nodes) -->
      <line x1="26" y1="22" x2="44" y2="22" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <line x1="26" y1="27" x2="44" y2="27" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="35" cy="17" r="2.5" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Central Title & Descriptions (Always in Foreground) -->
  <g transform="translate(255, 0)">
    <!-- Top Category Pill Tag -->
    <g class="floating-node-1" transform="translate(0, 32)">
      <rect x="0" y="0" width="230" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.85"/>
      <circle cx="12" cy="12" r="4" fill="#22c55e"/>
      <text x="24" y="16" fill="#a5b4fc" font-size="11" class="sub-text" letter-spacing="1">ENTERPRISE CLOUD ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="98" fill="url(#textGrad)" font-size="28" class="title-text" letter-spacing="0.3">
      Awesome Managed Cloud &amp; Consulting
    </text>

    <!-- Subtitle -->
    <text x="0" y="132" fill="#f1f5f9" font-size="14" class="sub-text">
      Global Consultancies, Enterprise MSPs &amp; Open-Source FinOps/Migration Tools
    </text>

    <!-- Feature Pillars / Badges -->
    <g transform="translate(0, 162)">
      <!-- Pill 1: Managed MSPs -->
      <rect x="0" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="67" y="17" fill="#bae6fd" font-size="11" text-anchor="middle" class="sub-text">☁️ Managed MSPs</text>

      <!-- Pill 2: Cloud Migration -->
      <rect x="145" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="217" y="17" fill="#c7d2fe" font-size="11" text-anchor="middle" class="sub-text">🚀 7Rs Migration</text>

      <!-- Pill 3: FinOps & Cost -->
      <rect x="300" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
      <text x="372" y="17" fill="#e9d5ff" font-size="11" text-anchor="middle" class="sub-text">💰 FinOps &amp; Cost</text>

      <!-- Pill 4: GRC & Governance -->
      <rect x="455" y="0" width="155" height="26" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
      <text x="532" y="17" fill="#a7f3d0" font-size="11" text-anchor="middle" class="sub-text">🛡️ Cloud Governance</text>
    </g>
  </g>

  <!-- Right Decorative Floating Cloud Nodes -->
  <g class="floating-node-2" transform="translate(760, 45)">
    <circle cx="60" cy="40" r="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <text x="60" y="45" font-size="15" text-anchor="middle">☁️</text>

    <circle cx="20" cy="110" r="15" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
    <text x="20" y="115" font-size="13" text-anchor="middle">⚡</text>

    <circle cx="85" cy="120" r="14" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5" opacity="0.8"/>
    <text x="85" y="125" font-size="12" text-anchor="middle">🌐</text>

    <!-- Node Connector Lines -->
    <line x1="60" y1="40" x2="20" y2="110" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="60" y1="40" x2="85" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  </g>

  <!-- Border Gradient Stroke -->
  <rect x="1" y="1" width="898" height="238" fill="none" stroke="url(#textGrad)" stroke-width="1.5" rx="15" opacity="0.4"/>
</svg>
