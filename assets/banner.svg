<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0f1d; border-radius:12px; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Animated Glow Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigoGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="85%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="pillGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .bg-canvas { fill: url(#bgGrad); }
    .grid-layer { fill: url(#cyberGrid); }
    .pulse-glow { animation: pulse 6s ease-in-out infinite alternate; }
    .particle { animation: floatAround 14s ease-in-out infinite alternate; }
    .flow-line { stroke-dasharray: 8, 8; animation: dashMove 20s linear infinite; }
    .flow-line-rev { stroke-dasharray: 6, 6; animation: dashMoveRev 16s linear infinite; }
    .node-pulse { animation: nodeBlink 3s ease-in-out infinite alternate; }
    
    @keyframes pulse {
      0% { opacity: 0.45; transform: scale(0.98); }
      100% { opacity: 0.85; transform: scale(1.02); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dashMoveRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 200; }
    }
    @keyframes floatAround {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
      100% { transform: translateY(6px) translateX(-10px); }
    }
    @keyframes nodeBlink {
      0% { r: 3.5; opacity: 0.5; }
      100% { r: 6; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="12" class="bg-canvas"/>
  <rect width="1200" height="360" rx="12" class="grid-layer"/>

  <!-- Background Dynamic Glow Spheres (Kept in Background behind Z-order) -->
  <g class="pulse-glow">
    <circle cx="180" cy="120" r="190" fill="url(#cyanGlow)"/>
    <circle cx="1020" cy="240" r="220" fill="url(#indigoGlow)"/>
    <circle cx="600" cy="180" r="200" fill="url(#purpleGlow)"/>
  </g>

  <!-- Subtle Dynamic Tech Circuit Lines in Background -->
  <g opacity="0.35">
    <path d="M 0 100 Q 300 40, 600 90 T 1200 80" fill="none" stroke="#0284c7" stroke-width="1.5" class="flow-line"/>
    <path d="M 0 280 Q 400 320, 800 270 T 1200 300" fill="none" stroke="#6366f1" stroke-width="1.5" class="flow-line-rev"/>
    <path d="M 150 0 L 150 360" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,8"/>
    <path d="M 1050 0 L 1050 360" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,8"/>
  </g>

  <!-- Interactive Floating Tech Particle Nodes (Z-order: Underneath text) -->
  <g class="particle" opacity="0.6">
    <circle cx="240" cy="70" class="node-pulse" fill="#38bdf8"/>
    <circle cx="960" cy="90" class="node-pulse" fill="#818cf8"/>
    <circle cx="180" cy="290" class="node-pulse" fill="#34d399"/>
    <circle cx="1040" cy="290" class="node-pulse" fill="#f472b6"/>
  </g>

  <!-- Cloud Infrastructure Architecture Nodes (Subtle Background Outlines) -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <!-- Cloud Left -->
    <path d="M 90 190 a 20 20 0 0 1 32 -14 a 30 30 0 0 1 54 4 a 22 22 0 0 1 12 40 l -90 0 a 16 16 0 0 1 -8 -30 z"/>
    <!-- Cloud Right -->
    <path d="M 1010 160 a 22 22 0 0 1 36 -15 a 34 34 0 0 1 60 4 a 25 25 0 0 1 14 44 l -100 0 a 18 18 0 0 1 -10 -33 z"/>
  </g>

  <!-- ================= FOREGROUND CONTENT (ALWAYS CRISP & PROMINENT) ================= -->

  <!-- Top Category Chip -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="-118" cy="0" r="4" fill="#38bdf8"/>
    <text x="-104" y="5" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="1.2">ENTERPRISE CLOUD ECOSYSTEM</text>
  </g>

  <!-- Main Banner Title (High Contrast, Bold, Centered) -->
  <text x="600" y="128" text-anchor="middle" font-size="38" font-weight="800" fill="url(#textGrad)" filter="url(#shadowGlow)" letter-spacing="-0.5">
    Awesome Managed Cloud &amp; Consulting Services
  </text>

  <!-- Subtitle (Clear, Readable, White/Slate) -->
  <text x="600" y="170" text-anchor="middle" font-size="16" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    The Curated Directory of Global Cloud Consultancies, Enterprise MSPs &amp; Open-Source FinOps/Migration Tools
  </text>

  <!-- Horizontal Tech Divider -->
  <g transform="translate(600, 202)">
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#334155" stroke-width="1.5"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="4.5" fill="#38bdf8"/>
  </g>

  <!-- Feature Pills Row (Pill Cards Highlighting Key Domains) -->
  <g transform="translate(600, 252)">
    <!-- Pill 1: Managed Cloud & MSPs -->
    <g transform="translate(-465, 0)">
      <rect x="0" y="0" width="215" height="42" rx="8" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
      <text x="20" y="26" fill="#38bdf8" font-size="16">☁️</text>
      <text x="48" y="26" fill="#f1f5f9" font-size="13" font-weight="600">Managed Cloud &amp; MSPs</text>
    </g>

    <!-- Pill 2: Cloud Migration 7Rs -->
    <g transform="translate(-235, 0)">
      <rect x="0" y="0" width="220" height="42" rx="8" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.45"/>
      <text x="18" y="26" fill="#818cf8" font-size="16">🚀</text>
      <text x="46" y="26" fill="#f1f5f9" font-size="13" font-weight="600">Cloud Migration &amp; 7Rs</text>
    </g>

    <!-- Pill 3: FinOps & Cost Governance -->
    <g transform="translate(15, 0)">
      <rect x="0" y="0" width="220" height="42" rx="8" fill="url(#pillGrad3)" stroke="#34d399" stroke-width="1" stroke-opacity="0.45"/>
      <text x="18" y="26" fill="#34d399" font-size="16">💰</text>
      <text x="46" y="26" fill="#f1f5f9" font-size="13" font-weight="600">FinOps &amp; Cost Control</text>
    </g>

    <!-- Pill 4: GRC & Security Hardening -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="215" height="42" rx="8" fill="url(#pillGrad4)" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.45"/>
      <text x="18" y="26" fill="#fbbf24" font-size="16">🛡️</text>
      <text x="46" y="26" fill="#f1f5f9" font-size="13" font-weight="600">Compliance &amp; Security</text>
    </g>
  </g>

  <!-- Bottom Metric / Status Ribbon -->
  <g transform="translate(600, 328)">
    <text x="0" y="0" text-anchor="middle" font-size="12" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      🏢 TOP 10 GLOBAL GSIs &amp; CONSULTANCIES &nbsp;|&nbsp; ⚡ 22+ OPEN-SOURCE TOOLS &nbsp;|&nbsp; 🌐 MULTI-CLOUD (AWS · AZURE · GCP)
    </text>
  </g>
</svg>
